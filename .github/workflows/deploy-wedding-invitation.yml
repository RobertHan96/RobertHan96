name: 모바일 청첩장 배포

on:
  push:
    branches:
      - main
      - codex/feature/mobile-wedding-invitation
    paths:
      - "wedding-invitation/**"
      - ".github/workflows/deploy-wedding-invitation.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: youngshin-daye-wedding-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wedding-invitation/package-lock.json

      - name: Install dependencies
        working-directory: wedding-invitation
        run: npm ci

      - name: Test
        working-directory: wedding-invitation
        run: npm test -- --run

      - name: Build
        working-directory: wedding-invitation
        run: npm run build

      - name: Ensure Pages project exists
        shell: bash
        run: |
          if ! npx wrangler@4 pages project list --json | PROJECT_NAME="$PROJECT_NAME" node -e 'let data=""; process.stdin.on("data", chunk => data += chunk).on("end", () => process.exit(JSON.parse(data).some(project => project.name === process.env.PROJECT_NAME) ? 0 : 1))'; then
            npx wrangler@4 pages project create "$PROJECT_NAME" --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: wedding-invitation
          command: pages deploy dist --project-name=youngshin-daye-wedding-2026 --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployment URL: $DEPLOYMENT_URL"
