name: "태스크7: 채용공고 모니터링"

on:
  schedule:
    # 월·금 10:00 KST = UTC 01:00
    - cron: "0 1 * * 1,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  job-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/automation/requirements.txt

      - name: Run job monitor
        working-directory: scripts/automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MEMORY_BRIDGE_URL: ${{ vars.TELEGRAM_MEMORY_BRIDGE_URL || secrets.TELEGRAM_MEMORY_BRIDGE_URL }}
          TELEGRAM_MEMORY_BRIDGE_TOKEN: ${{ secrets.TELEGRAM_MEMORY_BRIDGE_TOKEN }}
          TELEGRAM_MEMORY_SOURCE: "job-monitor"
        run: |
          test -n "$TELEGRAM_MEMORY_BRIDGE_URL" || { echo "::error::TELEGRAM_MEMORY_BRIDGE_URL이 비어 있습니다."; exit 1; }
          test -n "$TELEGRAM_MEMORY_BRIDGE_TOKEN" || { echo "::error::TELEGRAM_MEMORY_BRIDGE_TOKEN이 비어 있습니다."; exit 1; }
          python job_monitor.py
